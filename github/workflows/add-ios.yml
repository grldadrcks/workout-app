 name: Add iOS Platform Support

  on:
    workflow_dispatch:

  jobs:
    add-ios:
      runs-on: macos-latest
      permissions:
        contents: write

      steps:
        - uses: actions/checkout@v4

        - uses: subosito/flutter-action@v2
          with:
            channel: stable

        - name: Add iOS platform
          run: flutter create --org com.grldadrcks
  --platforms=ios .

        - name: Add iOS permissions to Info.plist
          run: |
            /usr/libexec/PlistBuddy \
              -c "Add
  :NSPhotoLibraryUsageDescription string 'Required
  to import workout photos.'" \
              ios/Runner/Info.plist
            /usr/libexec/PlistBuddy \
              -c "Add
  :NSDocumentsFolderUsageDescription string
  'Required to import and export workout data.'" \
              ios/Runner/Info.plist

        - name: Commit iOS files
          run: |
            git config user.name
  "github-actions[bot]"
            git config user.email
  "github-actions[bot]@users.noreply.github.com"
            git add ios/
            git diff --cached --quiet && echo
  "Nothing to commit" && exit 0
            git commit -m "feat: add iOS platform
  support"
            git push
